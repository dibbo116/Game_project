<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        h2 {
            text-align: center;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Progress Reports</h2>
        <table>
            <tr>
                <th>Student</th>
                <th>Total Questions</th>
                <th>Correct Answers</th>
            </tr>
            {% for data in report_data %}
                <tr>
                    <td>{{ data.username }}</td>
                    <td>{{ data.total_questions }}</td>
                    <td>{{ data.correct_answers }}</td>
                </tr>
            {% endfor %}
        </table>
        <a href="/teacher_dashboard"><button>Back to Dashboard</button></a>
    </div>
</body>
</html>
